<style id="cma-api-portal-enterprise-skin">
:root{
  --deep:#003B7A;
  --blue:#0066CC;
  --bright:#0066CC;
  --cyan:#8EB8F5;
  --orange:#E30613;
  --ink:#1F2937;
  --muted:#6B7280;
  --line:#E3E8F0;
  --pale:#F5F7FA;
  --success:#08775F;
  --success-bg:#ECF8F4;
  --warning:#8A4B08;
  --warning-bg:#FFF7E8;
  --shadow:0 12px 32px rgba(0,59,122,.10);
}
html{scroll-behavior:smooth}
body{
  background:linear-gradient(180deg,#FFFFFF 0 31%,#F5F7FA 31% 100%);
  color:var(--ink);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* Intro screen: visual restyle only */
.intro{
  color:var(--deep);
  background:linear-gradient(102deg,#C8D8FA 0%,#DFE8FC 58%,#F7F9FF 100%);
}
.intro:before{
  background:
    linear-gradient(90deg,rgba(0,59,122,.035),transparent 62%),
    repeating-linear-gradient(142deg,transparent 0 92px,rgba(0,59,122,.035) 93px 94px);
}
.intro-card{
  width:min(100%,1080px);
  padding:26px 34px 38px;
  border:1px solid rgba(0,59,122,.10);
  border-radius:3px;
  background:rgba(255,255,255,.76);
  box-shadow:0 16px 48px rgba(0,59,122,.12);
  backdrop-filter:blur(12px);
}
.intro-top{border-bottom:1px solid #DCE3EF}
.intro-brand strong{color:var(--deep)}
.intro-brand small{color:#66748B}
.intro-langs{padding:3px;border:1px solid #D8E0EC;background:#FFFFFF}
.intro-langs button{color:var(--deep);border-radius:1px}
.intro-langs button.active{color:#FFFFFF;background:var(--deep)}
.intro-copy{padding:58px 0 24px}
.intro-kicker{color:var(--deep);letter-spacing:.11em}
.intro h1{text-align:center;margin-left:auto;margin-right:auto;color:var(--deep);font-family:"Arial Narrow",Inter,"Segoe UI",sans-serif;letter-spacing:-.055em}
.intro-sub{color:var(--blue)}
.intro-copy p{text-align:center;color:#36557C}
.intro-solutions span{
  color:var(--deep);
  border:1px solid #D9E1ED;
  border-radius:2px;
  background:#FFFFFF;
  box-shadow:0 3px 10px rgba(0,59,122,.05);
}
.intro button.start{
  color:#FFFFFF;
  border-radius:1px;
  background:var(--orange);
  box-shadow:0 9px 24px rgba(227,6,19,.18);
}
.intro button.start:hover{background:#C9000B}
.intro-owner{color:#64748B}
.intro-owner b{color:var(--deep)}
.intro-watermark{color:rgba(0,59,122,.045)}
/* Portal-style white navigation */
.hero{
  min-height:390px;
  color:var(--deep);
  background:linear-gradient(102deg,#C9D9FA 0%,#DFE8FC 58%,#F7F9FF 100%);
}
.hero:before{
  background:
    linear-gradient(90deg,rgba(0,59,122,.035),transparent 58%),
    repeating-linear-gradient(142deg,transparent 0 92px,rgba(0,59,122,.03) 93px 94px);
}
.container{width:min(100%,1220px)}
.top{
  margin:0 calc((100vw - min(100%,1220px))/-2);
  padding:9px max(24px,calc((100vw - 1220px)/2));
  border-bottom:1px solid #E3E8F0;
  background:#FFFFFF;
  box-shadow:0 2px 10px rgba(0,59,122,.05);
}
.logo{color:var(--deep)}
.mark{
  width:50px;height:36px;
  color:var(--deep);
  border-color:var(--deep);
  border-radius:2px 12px 12px 2px;
}
.mark:after{background:var(--orange)}
.logo small{color:#68778D}
.langs{border:1px solid #D7DFEA;border-radius:2px;background:#FFFFFF}
.langs button{color:var(--deep);border-radius:1px}
.langs button.active,.langs button:hover{color:#FFFFFF;background:var(--deep)}
.hero-copy{padding:72px 0 112px}
.eyebrow{color:#294E7C}
.eyebrow:before{background:var(--orange)}
h1{
  max-width:900px;
  color:var(--deep);
  font-family:"Arial Narrow",Inter,"Segoe UI",sans-serif;
  font-weight:900;
  letter-spacing:-.055em;
}
.hero-copy p{color:#36557C;font-size:1rem}
.brand-watermark{color:rgba(0,59,122,.05)}
.ocean{border-color:rgba(0,102,204,.14);opacity:1}
/* Main workspace */
main{width:min(100%,1220px);margin:-58px auto 72px}
.tabs{
  gap:0;padding:0;
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:3px 3px 0 0;
  box-shadow:0 -4px 18px rgba(0,59,122,.05);
}
.tab{min-height:56px;border-radius:0;color:var(--muted);letter-spacing:.02em}
.tab+ .tab{border-left:1px solid var(--line)}
.tab.active{color:var(--deep);background:#EEF3FC;box-shadow:inset 0 -3px 0 var(--orange)}
.card{border-color:var(--line);box-shadow:var(--shadow)}
.monthly,.annual-card{border-radius:0 0 4px 4px}
.config,.forecast{border-color:var(--line);background:#FFFFFF}
.summary,.annual-results{background:linear-gradient(145deg,#FFFFFF,#F7FAFF)}
.config,.summary{padding:42px}
.annual-top{padding:36px 40px}
.forecast,.annual-results{padding:34px 38px}
.kicker{color:var(--blue)}
.kicker:before{content:"";display:inline-block;width:28px;height:3px;margin:0 9px 2px 0;background:var(--orange)}
h2,.forecast-head h3,.annual-results h3,.compare h3{color:var(--deep);font-weight:800}
.sub{color:var(--muted)}
label{color:#34445D}
select,input{border-color:#D8E0EB;border-radius:3px;background:#FFFFFF}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,102,204,.10)}
.formula{border-left:4px solid var(--orange);border-radius:0 2px 2px 0;background:#F7FAFF}
.tag{border-radius:2px;color:var(--deep);background:#E7F0FC}
.progress{border-radius:2px;background:#E4EAF2}
.progress div{border-radius:2px;background:linear-gradient(90deg,var(--deep),var(--blue))}
.best{border-radius:3px}
.package{border-radius:3px;box-shadow:none!important}
.package:after{height:3px;background:var(--orange)}
.price{color:var(--blue)}
.alternatives{gap:12px}
.alternative{border-radius:3px;box-shadow:0 3px 10px rgba(0,59,122,.04)}
.alternative.rec{border-color:var(--orange);background:#FFF}
.be-guide{border-left:4px solid var(--orange);border-radius:0 2px 2px 0;background:#F8FAFD}
.notice,.annual-volume,.strategy,.annual-best,.assumption,.guide{border-radius:3px}
.actions button{border-radius:2px;background:var(--orange)}
.actions button:hover{background:#C9000B}
.actions .ghost{color:var(--deep);border:1px solid var(--deep);background:#FFFFFF}
.small{border-radius:2px;color:var(--deep);background:#FFFFFF}
.small:hover{background:#EEF3FC}
.month-table th{color:#5D6C82;background:#F8FAFC}
.month-table td{border-color:#E9EEF4}
.strategy{box-shadow:none}
.strategy.best-strategy{border-color:var(--orange);box-shadow:inset 4px 0 0 var(--orange);background:#FFFFFF}
.annual-reference h4{color:var(--deep)}
.guide{border-color:var(--line);box-shadow:0 8px 28px rgba(0,59,122,.07)}
.guide-item{border-radius:2px;background:#F8FAFD}
.guide-item:nth-child(1){border-color:var(--deep)}
.guide-item:nth-child(2){border-color:var(--blue)}
.guide-item:nth-child(3){border-color:var(--orange)}
.source a{color:var(--blue)}
@media(max-width:900px){
  .top{margin:0 -24px;padding:9px 24px}
  .config,.summary,.annual-top,.forecast,.annual-results{padding:28px}
}
@media(max-width:560px){
  .intro-card{padding:20px}
  .hero-copy{padding:46px 0 96px}
  main{margin-top:-45px}
  .config,.summary,.annual-top,.forecast,.annual-results{padding:22px}
}

function localizeDic(){let d=dicLang();$('dicTab').textContent=d.tab;$('dicKicker').textContent=d.kicker;$('dicTitle').textContent=d.title;$('dicCopy').textContent=d.copy;$('dicTeuLabel').textContent=d.teu;$('dicTeuHelp').textContent=d.teuHelp;$('dicUsageTitle').textContent=d.usage;$('dicUsageCopy').textContent=d.usageCopy;$('dicFormula').innerHTML='<b>'+d.formula+'</b>';$('dicAnalysis').textContent=d.analysis;$('dicComparison').textContent=d.comparison;$('dicTraditionalLabel').textContent=d.traditional;$('dicCostLabel').textContent=d.dic;$('dicDifferenceLabel').textContent=d.difference;$('dicBreakEvenLabel').textContent=d.breakEven;$('dicColProduct').textContent=d.product;$('dicColUse').textContent=d.use;$('dicColPackage').textContent=d.package;$('dicColAnnual').textContent=d.annual;$('dicNotice').textContent=d.notice;$('copyDic').textContent=d.copyBtn;$('resetDic').textContent=d.reset;$('dicToast').textContent=d.copied;renderDic()}
function dicBest(p,v){return p.pk.map(x=>({name:x[0],cost:x[1]+Math.max(0,v-x[2])*p.rate})).reduce((a,b)=>b.cost<a.cost?b:a)}
function renderDic(){if(!$('dicTeu'))return;let d=dicLang(),teu=num($('dicTeu').value),trad=0,rows=[];document.querySelectorAll('.dicUsage').forEach(el=>{let p=P[el.dataset.p],v=num(el.value);if(v>0){let b=dicBest(p,v),annual=b.cost*12;trad+=annual;rows.push({p,v,b,annual})}});let dic=teu*DIC_RATE,diff=Math.abs(trad-dic),be=trad/DIC_RATE,tc=$('dicTraditionalCard'),dc=$('dicCostCard'),sc=$('dicDifferenceCard');$('dicTraditional').textContent=mf(trad);$('dicCost').textContent=mf(dic);$('dicDifference').textContent=mf(diff);$('dicBreakEven').textContent=nf(be)+' TEU';tc.classList.remove('traditional-best');dc.classList.remove('dic-recommended');sc.classList.remove('savings-positive','difference-neutral');$('dicDifferenceLabel').textContent=d.difference;if(!rows.length){$('dicDecision').innerHTML='<b>'+d.empty+'</b>'}else if(dic<trad){dc.classList.add('dic-recommended');sc.classList.add('savings-positive');$('dicDifferenceLabel').textContent=d.advText.replace(':','');$('dicDecision').innerHTML='<span class="dic-recommendation-badge">RECOMMENDED</span><b>'+d.adv+'</b>'+d.advText+' '+mf(trad-dic)}else if(dic>trad){tc.classList.add('traditional-best');sc.classList.add('difference-neutral');$('dicDecision').innerHTML='<b>'+d.pack+'</b>'+d.packText+' '+mf(dic-trad)}else{$('dicDecision').innerHTML='<b>'+d.equal+'</b>'+d.equalText}$('dicRows').innerHTML=rows.length?rows.map(x=>`<tr><td>${x.p.name}</td><td>${nf(x.v)} ${x.p.unit}</td><td>${x.b.name}</td><td>${mf(x.annual)}</td></tr>`).join(''):`<tr><td colspan="4">${d.empty}</td></tr>`}
function copyDicAnalysis(){let d=dicLang(),text=`DIC01 COMMERCIAL COMPARISON\n${d.teu}: ${$('dicTeu').value} TEU\n${d.traditional}: ${$('dicTraditional').textContent}\n${d.dic}: ${$('dicCost').textContent}\n${d.difference}: ${$('dicDifference').textContent}\n${d.breakEven}: ${$('dicBreakEven').textContent}`;navigator.clipboard.writeText(text).then(()=>{$('dicToast').classList.add('show');setTimeout(()=>$('dicToast').classList.remove('show'),2200)})}
buildDicInputs();$('dicTeu').addEventListener('input',renderDic);$('copyDic').addEventListener('click',copyDicAnalysis);$('resetDic').addEventListener('click',()=>{$('dicTeu').value=1000;document.querySelectorAll('.dicUsage').forEach(x=>x.value=0);renderDic()});document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>setTimeout(localizeDic,0)));localizeDic();
</script>
</body></html>
