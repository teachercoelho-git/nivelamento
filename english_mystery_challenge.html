<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Vanishing Manuscript | English Mystery Challenge</title>
<style>
:root{--bg:#08111f;--panel:#101d31;--panel2:#162640;--ink:#eef6ff;--muted:#9fb2ca;--cyan:#38d9ff;--gold:#ffd166;--green:#48e5a5;--red:#ff6b7a;--violet:#9b7bff}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 0,#18345d 0,#08111f 40%,#050a12 100%);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit}.app{max-width:1200px;margin:auto;padding:20px}.topbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:18px}.brand small{color:var(--cyan);letter-spacing:.18em;text-transform:uppercase}.brand h1{margin:5px 0 0;font-size:clamp(1.6rem,4vw,2.7rem)}.timer{background:#07101d;border:1px solid #284364;border-radius:18px;padding:12px 18px;text-align:center;min-width:150px}.timer span{display:block;color:var(--muted);font-size:.78rem}.timer b{font-size:1.65rem;color:var(--gold)}
.progress-wrap{background:#06101d;border:1px solid #233c59;border-radius:999px;height:12px;overflow:hidden;margin-bottom:18px}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:.4s}.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}.sidebar,.card{background:linear-gradient(160deg,rgba(20,38,64,.96),rgba(9,20,36,.96));border:1px solid #294565;box-shadow:0 18px 45px #0007;border-radius:22px}.sidebar{padding:16px;height:max-content;position:sticky;top:16px}.case-status{padding:13px;border-radius:16px;background:#091729;margin-bottom:15px}.case-status b{color:var(--green)}.steps{display:grid;gap:9px}.step{padding:11px 12px;border-radius:13px;color:#7f95ae;background:#0a1728;border:1px solid transparent;font-size:.91rem}.step.active{color:white;border-color:var(--cyan);box-shadow:0 0 0 2px #38d9ff18}.step.done{color:var(--green);border-color:#48e5a533}.evidence{margin-top:16px}.evidence h3{font-size:.9rem;color:var(--gold)}.evidence-list{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:.78rem;background:#1a2d49;border:1px solid #36587d;border-radius:999px;padding:6px 9px}.main{min-width:0}.card{padding:clamp(20px,4vw,38px);min-height:620px}.scene{display:none;animation:fade .35s ease}.scene.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.13em;text-transform:uppercase;font-size:.78rem}.scene h2{font-size:clamp(1.55rem,3vw,2.35rem);margin:8px 0}.lead{font-size:1.06rem;color:#c6d5e7;line-height:1.7;max-width:820px}.note{background:#081627;border-left:4px solid var(--gold);padding:15px 17px;border-radius:0 14px 14px 0;line-height:1.65;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.clue,.suspect,.option{background:#0a182b;border:1px solid #2d4969;border-radius:17px;padding:17px}.clue h3,.suspect h3{margin:0 0 8px;color:var(--gold)}.clue p,.suspect p{color:#bdd0e3;line-height:1.55}.question{margin:18px 0;padding:18px;background:#0a192c;border-radius:18px;border:1px solid #2b4868}.question strong{display:block;margin-bottom:11px}.choices{display:grid;gap:9px}.choice{background:#142741;color:white;border:1px solid #355678;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;transition:.2s}.choice:hover{transform:translateY(-1px);border-color:var(--cyan)}.choice.selected{border-color:var(--gold);background:#27344a}.choice.correct{border-color:var(--green);background:#123c36}.choice.wrong{border-color:var(--red);background:#40202a}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700}.field input,.field textarea,.field select{width:100%;background:#071526;color:white;border:1px solid #355474;border-radius:12px;padding:12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--cyan),#6c8cff);color:#04101b}.btn-secondary{background:#1a2d48;color:white;border:1px solid #365576}.btn-hint{background:#34294d;color:#e5dbff;border:1px solid #674fa0}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{display:none;margin-top:14px;padding:12px 15px;border-radius:12px}.feedback.show{display:block}.feedback.ok{background:#10382f;color:#a7f5d4}.feedback.no{background:#41202a;color:#ffc1c8}.codebox{display:flex;gap:8px;justify-content:center;margin:20px 0}.codebox input{width:54px;height:62px;text-align:center;font-size:1.5rem;text-transform:uppercase;background:#071526;color:var(--gold);border:1px solid #456583;border-radius:11px}.interview{border-left:3px solid var(--violet);padding-left:16px;margin:15px 0}.interview p{line-height:1.65}.speaker{color:#cdbfff;font-weight:800}.locked{filter:blur(6px);user-select:none}.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:20px auto;background:conic-gradient(var(--green) 0deg,#1d324c 0);position:relative}.score-ring:after{content:"";position:absolute;inset:13px;border-radius:50%;background:#0b192b}.score-ring b{z-index:1;font-size:2rem}.final-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.teacher-panel{margin-top:18px;border:1px dashed #516b87;border-radius:16px;padding:15px}.teacher-panel summary{cursor:pointer;color:var(--gold);font-weight:800}.mini{font-size:.85rem;color:var(--muted)}.pulse{animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 25px #38d9ff55}}@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static}.steps{grid-template-columns:repeat(3,1fr)}.step{font-size:.75rem}.grid,.final-grid{grid-template-columns:1fr}.topbar{grid-template-columns:1fr}.timer{width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brand"><small>Interactive English Investigation</small><h1>The Vanishing Manuscript</h1></div><div class="timer"><span>CASE CLOCK</span><b id="timer">30:00</b></div></div>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="case-status">Status: <b id="status">Waiting for detective</b><div class="mini">Score: <span id="scoreSide">0</span> XP</div></div>
      <div class="steps" id="steps"></div>
      <div class="evidence"><h3>EVIDENCE BAG</h3><div class="evidence-list" id="evidence"><span class="mini">Empty</span></div></div>
    </aside>
    <main class="main"><section class="card" id="card"></section></main>
  </div>
</div>
<script>
const scenes=[
{title:'Mission Briefing',render:()=>`
<div class="scene active"><div class="eyebrow">Case File 07</div><h2>A priceless story has disappeared.</h2>
<p class="lead">At 8:45 p.m., during the opening night of the Blackwood Literary Festival, the original manuscript of <em>The Last Lantern</em> vanished from a locked exhibition room. Four people were nearby. Your mission is to read carefully, question the evidence, and identify the thief.</p>
<div class="note"><b>Detective’s objective:</b> discover <b>WHO</b> took the manuscript, <b>HOW</b> they entered the room, and <b>WHY</b> they did it. Complete every English challenge to unlock the final accusation.</div>
<div class="field"><label>Detective name</label><input id="detective" placeholder="Type your name..." maxlength="30"></div>
<div class="field"><label>Difficulty</label><select id="level"><option value="standard">Standard (B1)</option><option value="advanced">Advanced (B2)</option></select></div>
<div class="actions"><button class="btn btn-primary pulse" onclick="startCase()">Accept the case</button></div>
<details class="teacher-panel"><summary>Teacher guide</summary><p class="mini">Let the student work independently. Ask them to explain every choice in English. During the audio challenge, read the witness script only twice. Suggested timing: 4–5 minutes per stage.</p></details></div>`},
{title:'The Crime Scene',render:()=>`
<div class="scene active"><div class="eyebrow">Stage 1 • Reading for detail</div><h2>Examine the crime scene</h2>
<p class="lead">Read the security report. Small details matter.</p>
<div class="note">The exhibition room was locked at 8:30 p.m. The guard checked the manuscript inside its glass case. At 8:45 p.m., the alarm sounded. The door was still locked, but the glass case was empty. A narrow window was open. It had rained earlier, yet there were no wet footprints beneath it. On the floor, investigators found a silver button and a torn train ticket marked <b>9:10 p.m.</b></div>
<div class="question"><strong>1. Which fact makes the window look like a false clue?</strong><div class="choices" data-q="q1"><button class="choice" data-good="1">There were no wet footprints below it.</button><button class="choice">The alarm sounded at 8:45.</button><button class="choice">The ticket said 9:10.</button></div></div>
<div class="question"><strong>2. What can we safely conclude?</strong><div class="choices" data-q="q2"><button class="choice">The thief definitely escaped by train.</button><button class="choice" data-good="1">Someone may have opened the window to mislead investigators.</button><button class="choice">The guard stole the manuscript.</button></div></div>
<div class="actions"><button class="btn btn-hint" onclick="hint('Focus on the weather and what should have been on the floor.')">Use a hint (-5 XP)</button><button class="btn btn-primary" onclick="checkChoices(['q1','q2'],1,'Window clue')">Secure evidence</button></div><div class="feedback" id="fb"></div></div>`},
{title:'Suspect Interviews',render:()=>`
<div class="scene active"><div class="eyebrow">Stage 2 • Reading between the lines</div><h2>Interview the suspects</h2>
<div class="grid">
<div class="suspect"><h3>Maya Chen, journalist</h3><p>“I was interviewing the festival director in the lobby from 8:35 until the alarm. He can confirm it. I missed my 9:10 train because the police kept everyone inside.”</p></div>
<div class="suspect"><h3>Leo Grant, collector</h3><p>“I admired the manuscript earlier. At 8:40, I went outside to call my driver. My dark blue coat lost a silver button last week, but I replaced it yesterday.”</p></div>
<div class="suspect"><h3>Nora Bell, curator</h3><p>“Only the guard and I have keys. I was on the main stage introducing the author. Hundreds of people saw me. The alarm uses a separate code.”</p></div>
<div class="suspect"><h3>Oliver Reed, technician</h3><p>“I was repairing a projector in Room B. The building map is outdated: there used to be a service passage behind the exhibition wall, but it was sealed years ago.”</p></div></div>
<div class="question"><strong>Whose statement creates the strongest new lead?</strong><div class="choices" data-q="q3"><button class="choice">Maya, because she had a train ticket.</button><button class="choice">Leo, because collectors always want rare objects.</button><button class="choice">Nora, because she had a key.</button><button class="choice" data-good="1">Oliver, because he mentioned a hidden service passage.</button></div></div>
<div class="field"><label>In one sentence, explain your reasoning in English:</label><textarea id="reason" rows="3" placeholder="Oliver's statement is important because..."></textarea></div>
<div class="actions"><button class="btn btn-hint" onclick="hint('Look for information that explains how a locked room might be entered.')">Use a hint (-5 XP)</button><button class="btn btn-primary" onclick="checkInterview()">Follow the lead</button></div><div class="feedback" id="fb"></div></div>`},
{title:'Grammar Lock',render:()=>`
<div class="scene active"><div class="eyebrow">Stage 3 • Grammar decoder</div><h2>Repair the witness statements</h2><p class="lead">Choose the grammatically correct sentence in each pair. Write down the number beside each correct answer to obtain a four-digit code.</p>
${grammarQ('g1','By the time the alarm rang, the manuscript had disappeared.','By the time the alarm rang, the manuscript disappeared already.','6',true)}
${grammarQ('g2','If the window was the escape route, the floor would have been wet.','If the window had been the escape route, the floor would have been wet.','3',false)}
${grammarQ('g3','The curator said that she was standing on the main stage.','The curator said that she is standing on the main stage.','8',true)}
${grammarQ('g4','The passage might have reopened from inside.','The passage might have been reopened from inside.','1',false)}
<div class="field"><label>Enter the four-digit code</label><input id="grammarCode" inputmode="numeric" maxlength="4" placeholder="_ _ _ _"></div>
<div class="actions"><button class="btn btn-hint" onclick="hint('Correct-answer numbers, from top to bottom, form the code. Think about past perfect, third conditional, reported speech and passive voice.')">Use a hint (-5 XP)</button><button class="btn btn-primary" onclick="checkGrammar()">Unlock the archive</button></div><div class="feedback" id="fb"></div></div>`},
{title:'The Voice Message',render:()=>`
<div class="scene active"><div class="eyebrow">Stage 4 • Listening challenge</div><h2>A witness left a voice message</h2><p class="lead">Your teacher will read the message below. Do not look at the script until you have listened twice. Take notes and answer the questions.</p>
<div class="note locked" id="audioScript">“This is Daniel, from the café opposite the museum. At around twenty to nine, I saw a person in a dark blue coat enter the side alley. Five minutes later, the same person came back without the coat and walked towards the station. I couldn't see the person's face, but I heard something metallic fall near the drain.”</div>
<details class="teacher-panel"><summary>Teacher: click here for instructions</summary><p class="mini">Read the blurred message naturally twice. After the student submits, the script becomes visible.</p></details>
<div class="question"><strong>1. When did the witness first see the person?</strong><input id="l1" placeholder="e.g. at..." /></div>
<div class="question"><strong>2. What changed when the person returned?</strong><input id="l2" placeholder="The person..." /></div>
<div class="question"><strong>3. Where did the person walk?</strong><input id="l3" placeholder="Towards..." /></div>
<div class="actions"><button class="btn btn-hint" onclick="hint('“Twenty to nine” means 8:40. Listen for the coat and the destination.')">Use a hint (-5 XP)</button><button class="btn btn-primary" onclick="checkListening()">Analyze message</button></div><div class="feedback" id="fb"></div></div>`},
{title:'Evidence Decoder',render:()=>`
<div class="scene active"><div class="eyebrow">Stage 5 • Vocabulary & deduction</div><h2>Decode the maintenance log</h2>
<p class="lead">Complete each word. The highlighted letters form a keyword.</p>
<div class="grid">
<div class="clue"><h3>1. A person who sees an event</h3><input id="v1" placeholder="W _ _ _ _ _ _"></div>
<div class="clue"><h3>2. Proof that supports a conclusion</h3><input id="v2" placeholder="E _ _ _ _ _ _"></div>
<div class="clue"><h3>3. A reason for committing a crime</h3><input id="v3" placeholder="M _ _ _ _ _"></div>
<div class="clue"><h3>4. A statement that proves you were elsewhere</h3><input id="v4" placeholder="A _ _ _ _"></div></div>
<div class="note">Maintenance log: “Service passage inspected. New electronic lock fitted. Temporary access code issued to the <b>festival technology contractor</b>. Passage will be permanently sealed after the event.”</div>
<div class="question"><strong>Which earlier statement is now suspicious?</strong><div class="choices" data-q="q4"><button class="choice">Maya said she missed her train.</button><button class="choice">Leo said he called his driver.</button><button class="choice">Nora said she was on stage.</button><button class="choice" data-good="1">Oliver said the passage had been sealed years ago.</button></div></div>
<div class="actions"><button class="btn btn-hint" onclick="hint('The four vocabulary answers begin with W, E, M and A. Compare Oliver’s claim with the maintenance log.')">Use a hint (-5 XP)</button><button class="btn btn-primary" onclick="checkVocabulary()">Connect the evidence</button></div><div class="feedback" id="fb"></div></div>`},
{title:'Final Accusation',render:()=>`
<div class="scene active"><div class="eyebrow">Final Stage • Speaking & reasoning</div><h2>Make your accusation</h2><p class="lead">A strong detective does not only name a suspect. They explain the method, motive, and evidence.</p>
<div class="final-grid"><div>
<div class="field"><label>Who stole the manuscript?</label><select id="who"><option value="">Choose...</option><option>Maya Chen</option><option>Leo Grant</option><option>Nora Bell</option><option>Oliver Reed</option></select></div>
<div class="field"><label>How did the thief enter?</label><select id="how"><option value="">Choose...</option><option>Through the window</option><option>With the curator's key</option><option>Through the service passage</option><option>Through the front door</option></select></div>
<div class="field"><label>Why? Choose the most likely motive.</label><select id="why"><option value="">Choose...</option><option>To catch a train</option><option>To sell a valuable original</option><option>To repair the alarm</option><option>To interview the author</option></select></div></div>
<div class="clue"><h3>Oral case report</h3><p>Speak for 45–60 seconds. Use:</p><ul><li><b>I believe...</b></li><li><b>The strongest evidence is...</b></li><li><b>Although..., the evidence shows...</b></li><li><b>Therefore...</b></li></ul><div class="field"><textarea id="report" rows="5" placeholder="Write key words for your spoken report..."></textarea></div></div></div>
<div class="actions"><button class="btn btn-primary pulse" onclick="solveCase()">Submit final accusation</button></div><div class="feedback" id="fb"></div></div>`},
{title:'Case Closed',render:()=>endScreen()}
];
function grammarQ(id,a,b,num,first){return `<div class="question"><strong>${num} • Choose the correct sentence</strong><div class="choices" data-q="${id}"><button class="choice" ${first?'data-good="1"':''}>${a}</button><button class="choice" ${!first?'data-good="1"':''}>${b}</button></div></div>`}
let current=0,score=0,hints=0,evidence=[],started=false,remaining=1800,tick,detective='Detective';
function init(){document.getElementById('steps').innerHTML=scenes.map((s,i)=>`<div class="step ${i===0?'active':''}" id="step${i}">${i+1}. ${s.title}</div>`).join('');render()}
function render(){document.getElementById('card').innerHTML=scenes[current].render();bindChoices();updateUI()}
function bindChoices(){document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}))}
function startCase(){const n=document.getElementById('detective').value.trim();if(n)detective=n;started=true;document.getElementById('status').textContent='Investigation active';tick=setInterval(()=>{remaining--;const m=String(Math.floor(remaining/60)).padStart(2,'0'),s=String(remaining%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`;if(remaining<=0){clearInterval(tick);document.getElementById('timer').textContent='TIME!'}},1000);next()}
function updateUI(){document.querySelectorAll('.step').forEach((el,i)=>el.className='step '+(i<current?'done':i===current?'active':''));document.getElementById('progress').style.width=`${(current/(scenes.length-1))*100}%`;document.getElementById('scoreSide').textContent=score;document.getElementById('evidence').innerHTML=evidence.length?evidence.map(x=>`<span class="chip">${x}</span>`).join(''):'<span class="mini">Empty</span>'}
function next(){current++;render();window.scrollTo({top:0,behavior:'smooth'})}
function feedback(ok,msg){const f=document.getElementById('fb');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=msg}
function hint(msg){if(!confirm('Use one hint and lose 5 XP?'))return;hints++;score=Math.max(0,score-5);updateUI();alert('HINT: '+msg)}
function selectedGood(q){const s=document.querySelector(`[data-q="${q}"] .selected`);return s&&s.dataset.good==='1'}
function markAll(){document.querySelectorAll('.choices').forEach(g=>g.querySelectorAll('.choice').forEach(b=>{if(b.dataset.good)b.classList.add('correct');else if(b.classList.contains('selected'))b.classList.add('wrong')}))}
function pass(item,pts=20){score+=pts;if(item&&!evidence.includes(item))evidence.push(item);updateUI();setTimeout(next,850)}
function checkChoices(qs,stage,item){if(qs.some(q=>!document.querySelector(`[data-q="${q}"] .selected`)))return feedback(false,'Choose an answer for every question.');markAll();if(qs.every(selectedGood)){feedback(true,'Excellent observation. The window was staged. Evidence secured!');pass(item)}else feedback(false,'Not quite. Compare the rain with the floor, then try again.')}
function checkInterview(){const reason=document.getElementById('reason').value.trim();if(!document.querySelector('[data-q="q3"] .selected')||reason.split(/\s+/).length<5)return feedback(false,'Select an answer and explain it in at least five words.');markAll();if(selectedGood('q3')){feedback(true,'Good deduction. A hidden route could explain the locked room.');pass('Hidden passage')}else feedback(false,'Look for the statement that provides a possible route into a locked room.')}
function checkGrammar(){markAll();const all=['g1','g2','g3','g4'].every(selectedGood);const code=document.getElementById('grammarCode').value.replace(/\s/g,'');if(all&&code==='6381'){feedback(true,'Archive unlocked. Your grammar restored the timeline.');pass('Archive code 6381',25)}else feedback(false,'The lock remains closed. Review the tense and voice in each sentence. The correct code is made from the numbers beside your correct choices.')}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9: ]/g,'').trim()}
function checkListening(){let a=norm(document.getElementById('l1').value),b=norm(document.getElementById('l2').value),c=norm(document.getElementById('l3').value);document.getElementById('audioScript').classList.remove('locked');let ok=(a.includes('840')||a.includes('8:40')||a.includes('twenty to nine'))&&(b.includes('without')||b.includes('no coat')||b.includes('coat'))&&(c.includes('station'));if(ok){feedback(true,'Sharp listening. The coat connects the alley, the silver button, and a possible disguise.');pass('Blue coat sighting',25)}else feedback(false,'The transcript is now visible. Correct the answers using the exact time, the coat detail, and the destination.')}
function checkVocabulary(){let vals=['witness','evidence','motive','alibi'];let typed=['v1','v2','v3','v4'].map(id=>norm(document.getElementById(id).value));if(!document.querySelector('[data-q="q4"] .selected'))return feedback(false,'Complete the words and choose the suspicious statement.');markAll();if(vals.every((v,i)=>typed[i]===v)&&selectedGood('q4')){feedback(true,'WEMA decoded. More importantly, Oliver knew the passage existed but lied about its condition.');pass('Contractor access',30)}else feedback(false,'Check the definitions: witness, evidence, motive, alibi. Then compare Oliver’s words with the log.')}
function solveCase(){let who=document.getElementById('who').value,how=document.getElementById('how').value,why=document.getElementById('why').value,rep=document.getElementById('report').value.trim();if(!who||!how||!why||rep.split(/\s+/).length<6)return feedback(false,'Complete all fields and add at least a few key words for your oral report.');if(who==='Oliver Reed'&&how==='Through the service passage'&&why==='To sell a valuable original'){score+=40;evidence.push('Case solved');clearInterval(tick);feedback(true,'Correct! Oliver used his temporary contractor code, entered through the service passage, planted misleading clues, and headed toward the station.');setTimeout(next,1200)}else feedback(false,'Your accusation does not explain all the evidence. Reconsider the contractor access code, the lie about the passage, and the route toward the station.')}
function endScreen(){let max=160,pct=Math.min(100,Math.round(score/max*100));return `<div class="scene active" style="text-align:center"><div class="eyebrow">Investigation complete</div><h2>CASE SOLVED, ${detective.toUpperCase()}!</h2><p class="lead" style="margin:auto">You identified Oliver Reed. As the festival’s technology contractor, he had temporary access to the service passage. His claim that it had been sealed for years contradicted the maintenance log. The open window, train ticket, and silver button were planted or manipulated to point toward other suspects.</p><div class="score-ring" style="background:conic-gradient(var(--green) ${pct*3.6}deg,#1d324c 0)"><b>${score} XP</b></div><div class="grid" style="text-align:left"><div class="clue"><h3>Language skills used</h3><p>Reading for detail • inference • past perfect • conditionals • reported speech • passive voice • listening • speaking</p></div><div class="clue"><h3>Detective record</h3><p>Hints used: <b>${hints}</b><br>Time remaining: <b>${Math.max(0,Math.floor(remaining/60))} min ${Math.max(0,remaining%60)} sec</b></p></div></div><div class="note" style="text-align:left"><b>Final speaking extension:</b> Retell the case in 60–90 seconds using at least five sequencing expressions: <em>initially, meanwhile, however, by the time, as a result, therefore</em>.</div><div class="actions" style="justify-content:center"><button class="btn btn-primary" onclick="location.reload()">Play again</button><button class="btn btn-secondary" onclick="window.print()">Print result</button></div></div>`}
init();
</script>
</body>
</html>
