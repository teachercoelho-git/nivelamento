function renderForecast(){let p=P[annualSel.value],e=p.formula;$('annualCallsWrap').style.display=e?'block':'none';$('annualInputHeader').textContent=e?tx('bookings'):tx('monthlyVolumeHeader');$('annualUsageHeader').textContent=e?tx('monthlyVolumeHeader'):'';$('monthsBody').innerHTML=forecast.map((v,i)=>{let use=e?v*num(annualCalls.value)*30:v,starter=opts(p,use)[0];return `<tr><td>${tx('months')[i]}</td><td><input class="monthInput" data-i="${i}" type="number" min="0" step="1" value="${v}"></td><td>${e?nf(use):'—'}</td><td>${mf(starter.cost)}</td></tr>`}).join('');document.querySelectorAll('.monthInput').forEach(x=>x.addEventListener('input',ev=>{forecast[+ev.target.dataset.i]=num(ev.target.value);renderAnnual()}));renderAnnual()}
function renderAnnual(){let p=P[annualSel.value],e=p.formula,usage=forecast.map(v=>e?v*num(annualCalls.value)*30:v),total=usage.reduce((a,b)=>a+b,0),strategies=p.pk.map(x=>({name:x[0],cost:usage.reduce((sum,v)=>sum+x[1]+Math.max(0,v-x[2])*p.rate,0)})),best=strategies.reduce((a,b)=>b.cost<a.cost?b:a,strategies[0]),peaks=usage.map((v,i)=>({v,i})).filter(x=>x.v>p.pk[0][2]),breakV=p.pk[0][2]+(p.pk[1][1]-p.pk[0][1])/p.rate;$('annualVolume').textContent=`${nf(total)} ${p.unit}`;$('strategies').innerHTML=strategies.map(s=>`<div class="strategy ${s.name===best.name?'best-strategy':''}"><div class="strategy-head"><b>${s.name==='STARTER'?tx('fixedStarter'):s.name==='POWER'?tx('fixedPower'):tx('fixedAdvanced')}</b><strong>${mf(s.cost)}</strong></div><p>${tx('perMonth')} × 12 ${tx('includingOverage')} ${tx('overage')}.</p></div>`).join('');$('annualBest').innerHTML=`<b>${tx('annualBestTitle')} ${best.name}</b>${best.name} ${tx('annualBestText')}`;$('breakdown').innerHTML=`<div class="breakdown-row"><span>${tx('peakMonths')}</span><b>${peaks.length?peaks.map(x=>tx('months')[x.i]).join(', '):'—'}</b></div><div class="breakdown-row"><span>${tx('monthlyBreakEven')}</span><b>${nf(breakV)} ${p.unit}</b></div>`}
function refresh(){monthlyLabels();renderMonthly();renderForecast()}function copyMonthly(){let p=P[sel.value],v=num(vol.value),c=pick(p,v),text=`CMA CGM DIGITAL CONNECTION\n\n${tx('productLabel')}: ${p.name}\n${tx('estimatedVolume')}: ${nf(v)} ${p.unit}\n${tx('recommendedPackage')}: ${c.custom?'CUSTOM':c.name}\n${tx('comparisonTitle')}: ${c.custom?tx('contact'):mf(c.cost)}`;navigator.clipboard.writeText(text).then(()=>{$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)})}function copyAnnual(){let p=P[annualSel.value],e=p.formula,u=forecast.map(v=>e?v*num(annualCalls.value)*30:v),st=p.pk.map(x=>({name:x[0],cost:u.reduce((s,v)=>s+x[1]+Math.max(0,v-x[2])*p.rate,0)})),best=st.reduce((a,b)=>b.cost<a.cost?b:a,st[0]),text=`CMA CGM DIGITAL CONNECTION — ${tx('annualComparison')}\n\n${tx('productLabel')}: ${p.name}\n${tx('annualVolume')}: ${nf(u.reduce((a,b)=>a+b,0))} ${p.unit}\n\n${st.map(x=>`${x.name}: ${mf(x.cost)}`).join('\n')}\n\n${tx('annualBestTitle')} ${best.name} — ${mf(best.cost)}`;navigator.clipboard.writeText(text).then(()=>{$('annualToast').classList.add('show');setTimeout(()=>$('annualToast').classList.remove('show'),2200)})}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{L=b.dataset.lang;localize();populate(sel);populate(annualSel);refresh()}));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')}));sel.addEventListener('change',()=>{monthlyLabels();renderMonthly()});vol.addEventListener('input',renderMonthly);[items,freq].forEach(x=>x.addEventListener('input',()=>{if(P[sel.value].formula){monthlyLabels();renderMonthly()}}));annualSel.addEventListener('change',()=>{forecast=Array(12).fill(0);annualCalls.value=0;renderForecast()});annualCalls.addEventListener('input',renderForecast);$('fillLow').addEventListener('click',()=>{forecast=Array(12).fill(50);renderForecast()});$('fillPeak').addEventListener('click',()=>{forecast=Array(12).fill(50);forecast[9]=400;forecast[10]=400;renderForecast()});$('clearMonths').addEventListener('click',()=>{forecast=Array(12).fill(0);renderForecast()});$('copyButton').addEventListener('click',copyMonthly);$('copyAnnual').addEventListener('click',copyAnnual);$('resetButton').addEventListener('click',()=>{sel.value='essential';items.value=0;freq.value=0;vol.value=0;forecast=Array(12).fill(0);annualCalls.value=0;monthlyLabels();renderMonthly();renderForecast()});localize();populate(sel);populate(annualSel);refresh();
